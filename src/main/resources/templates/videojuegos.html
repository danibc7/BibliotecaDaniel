<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BibliotecaDaniel - Videojuegos</title>

    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/tablas.css}">
    <link rel="stylesheet" th:href="@{/css/formularios.css}">
</head>
<body>
<h1>Biblioteca de Videojuegos</h1>
<h2>Listado de Videojuegos</h2>

<form th:action="@{/videojuegos}" method="get">

    <label for="titulo">Título:</label>
    <input type="text" id="titulo" name="titulo" th:value="${titulo}">

    <label for="desarrolladora">Desarrolladora:</label>


    <select id="desarrolladora" name="idDesarrolladora">

        <option value="">Todas las desarrolladoras</option>

        <option th:each="desarrolladora : ${desarrolladoras}"
                th:value="${desarrolladora.id}"
                th:text="${desarrolladora.nombre}"
                th:selected="${desarrolladora.id == idDesarrolladora}">

        </option>

    </select>

    <label for="anioDesde">Año desde:</label>
    <input type="number" id="anioDesde" name="anioDesde" min="1970" th:value="${anioDesde}">


    <label for="pegiMaximo">PEGI máximo:</label>
    <select id="pegiMaximo" name="pegiMaximo">

        <option value="">Todos los PEGI</option>
        <option value="3" th:selected="${pegiMaximo == 3}">PEGI 3</option>
        <option value="7" th:selected="${pegiMaximo == 7}">PEGI 7</option>
        <option value="12" th:selected="${pegiMaximo == 12}">PEGI 12</option>
        <option value="16" th:selected="${pegiMaximo == 16}">PEGI 16</option>
        <option value="18" th:selected="${pegiMaximo == 18}">PEGI 18</option>

    </select>
    <label for="soloDisponibles">
        <input type="checkbox"
               id="soloDisponibles"
               name="soloDisponibles"
               value="true"
               th:checked="${soloDisponibles}">
        Solo videojuegos con copias disponibles
    </label>



    <button type="submit">Buscar</button>

</form>


<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Año de lanzamiento</th>
        <th>PEGI</th>
        <th>Desarrolladora</th>
        <th>Copias totales</th>
        <th>Copias disponibles</th>
    </tr>
    </thead>


    <tbody>
    <tr th:each="videojuego : ${videojuegos}">
        <td th:text="${videojuego.id}"></td>
        <td th:text="${videojuego.titulo}"></td>
        <td th:text="${videojuego.anioLanzamiento}"></td>
        <td th:text="${videojuego.pegi}"></td>
        <td th:text="${videojuego.nombreDesarrolladora}"></td>
        <td th:text="${videojuego.copiasTotales}"></td>
        <td th:text="${videojuego.copiasDisponibles}"></td>
    </tr>
    </tbody>

</table>

</body>
</html>
